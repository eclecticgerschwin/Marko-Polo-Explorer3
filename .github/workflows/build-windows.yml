name: Build Windows Standalone EXE

on:
  workflow_dispatch:        # run manually from the GitHub "Actions" tab
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Version is NOT bumped here - the Mac's BUILD_AND_PACKAGE.command sets it
      # and commits it, so Mac and Windows releases always share one version.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller

      - name: Build one-file exe
        shell: pwsh
        run: |
          $assets = @("markopolo.png","markopolo.ico","markopolo_animated.gif","robot_blink.gif",
                      "ARW button clicked left.png","ARW button clicked right.png",
                      "ARW-active.png","ARW-active.jpeg","ARW-buttons not active.png",
                      "folder.png","folder2.png","version.json")
          $addData = @()
          foreach ($a in $assets) {
            if (Test-Path $a) { $addData += "--add-data"; $addData += "$a;." }
          }
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name MarkoPoloExplorer --icon markopolo.ico `
            @addData image_capture_app.py

      - name: Package zip for website + auto-updater
        shell: pwsh
        run: Compress-Archive -Force -Path "dist/MarkoPoloExplorer.exe","version.json" -DestinationPath "MarkoPoloExplorer-Windows.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarkoPoloExplorer-Windows
          path: |
            MarkoPoloExplorer-Windows.zip
            version.json
